<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join on Ansora</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(160deg, #fff0f2 0%, #ffe4e8 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 40px rgba(200, 16, 46, 0.15);
    }
    .logo { font-size: 28px; font-weight: 800; color: #C8102E; letter-spacing: 1px; margin-bottom: 4px; }
    .tagline { font-size: 13px; color: #9ca3af; margin-bottom: 28px; }
    .avatar { font-size: 52px; margin-bottom: 16px; }
    .invite-text { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
    .invite-sub { font-size: 14px; color: #6b7280; margin-bottom: 28px; line-height: 1.6; }
    .code-box {
      background: #fff5f7;
      border: 2px solid #ffd6dd;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
    }
    .code-label { font-size: 11px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; }
    .code-value { font-size: 38px; font-weight: 800; color: #C8102E; letter-spacing: 10px; }
    .status {
      font-size: 15px; color: #6b7280; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #C8102E; display: inline-block;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    .fallback { font-size: 12px; color: #c0c0c0; margin-top: 8px; }
    .fallback a { color: #C8102E; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Ansora</div>
    <div class="tagline">Compatibility · Connection · Clarity</div>
    <div class="avatar">💑</div>
    <div class="invite-text">You've been invited to connect!</div>
    <div class="invite-sub">Your partner wants to discover your compatibility on Ansora.</div>
    <div class="code-box">
      <div class="code-label">Connect Code</div>
      <div class="code-value" id="code-display">------</div>
    </div>
    <div class="status" id="status">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span id="status-text">Opening Ansora…</span>
    </div>
    <div class="fallback" id="fallback" style="display:none;">
      Didn't open? <a id="open-link" href="#">Open Ansora</a> · <a id="store-link" href="#">Download</a>
    </div>
  </div>

  <script>
    const segments = window.location.pathname.split('/').filter(Boolean);
    const code = segments[segments.length - 1] || '';
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const storeUrl = isIOS
      ? 'https://apps.apple.com/app/ansora/id6738420794'
      : 'https://play.google.com/store/apps/details?id=com.quixentsolutions.ansora';
    const storeLabel = isIOS ? 'App Store' : 'Play Store';
    document.getElementById('store-link').href = storeUrl;

    if (code && /^\d{6}$/.test(code)) {
      document.getElementById('code-display').textContent = code.slice(0, 3) + ' ' + code.slice(3);
      document.getElementById('open-link').href = 'ansora://join/' + code;

      // Try to open app
      window.location.href = 'ansora://join/' + code;

      // If app not installed, redirect to correct store after 1.5s
      const timer = setTimeout(function () {
        document.getElementById('status-text').textContent = 'Redirecting to ' + storeLabel + '…';
        setTimeout(function () {
          window.location.href = storeUrl;
        }, 500);
      }, 1500);

      // App opened → page goes hidden → cancel store redirect
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          clearTimeout(timer);
          setTimeout(function () {
            if (document.hidden) return;
            document.getElementById('status').style.display = 'none';
            document.getElementById('fallback').style.display = 'block';
          }, 2000);
        }
      });
      window.addEventListener('blur', function () { clearTimeout(timer); });
    } else {
      document.getElementById('status-text').textContent = 'Download Ansora to get started';
      setTimeout(function () { window.location.href = storeUrl; }, 2000);
    }
  </script>
</body>
</html>
