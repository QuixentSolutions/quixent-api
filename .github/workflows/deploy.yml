name: Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          echo "${{ secrets.AZURE_VM_SSH_KEY }}" > key.pem
          chmod 400 key.pem

      - name: Deploy
        env:
          HOST: ${{ secrets.AZURE_VM_HOST }}
          USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i key.pem \
              $USER@$HOST << 'EOF'

            cd ~/apps/newshop-trichy-api

            git pull origin main

            chmod +x deploy.sh

            ./deploy.sh

          EOF

      - name: Cleanup
        run: rm -f key.pem
